<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Encoder & Decoder</title>
  <style>


    body {
      margin: 0;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #f5f7fa;
      color: #222;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-weight: 600;
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #0a2540;
      text-align: center;
    }

    h2 {
      font-weight: 600;
      font-size: 1.25rem;
      margin-bottom: 0.75rem;
      color: #0a2540;
      border-bottom: 2px solid #0a2540;
      padding-bottom: 0.25rem;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
      padding: 2rem 2.5rem;
    }

    section {
      margin-bottom: 2.5rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #33475b;
      user-select: text;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1.5px solid #ccd6e0;
      border-radius: 6px;
      resize: vertical;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: border-color 0.3s ease;
      box-sizing: border-box;
      color: #0a2540;
    }

    textarea:focus {
      outline: none;
      border-color: #0052cc;
      box-shadow: 0 0 5px rgba(0,82,204,0.5);
      background-color: #f0f5ff;
    }

    textarea[readonly] {
      background-color: #e9ecef;
      color: #495057;
      border-color: #ced4da;
    }

    .button-row {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    button {
      background-color: #0052cc;
      color: white;
      border: none;
      padding: 0.6rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.25s ease;
      user-select: none;
      flex: 1 1 120px;
      text-align: center;
    }

    button:hover {
      background-color: #003d99;
    }

    button:active {
      background-color: #002d73;
    }

    .paste-button {
      background-color: #cce4ff; /* pastel blue */
      color: #003366;
      border: none;
      padding: 0.6rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.25s ease;
      user-select: none;
      flex: 1 1 120px;
      text-align: center;
    }

    .paste-button:hover {
      background-color: #b3d8ff;
    }

    .paste-button:active {
      background-color: #99ccff;
    }

    hr {
      border: none;
      border-top: 1px solid #e1e4e8;
      margin: 3rem 0;
    }

    #copyTooltip {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: #0052cc;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }

    #copyTooltip.show {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      .container {
        padding: 1.5rem 1.5rem;
      }
      button {
        flex: 1 1 100%;
      }
    }
    [hidden] { display: none !important; }
    button:focus-visible { outline: 3px solid #0a2540; outline-offset: 3px; }
    button { min-height: 44px; }
    .landing { text-align: center; padding-top: 3rem; padding-bottom: 3rem; }
    .landing p { color: #33475b; margin-bottom: 2rem; }
    .landing button { min-width: 160px; }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; max-width: 780px; margin: 0 auto 1rem; }
    .app-header h1 { text-align: left; font-size: clamp(1.3rem, 5vw, 2rem); }
    .app-header button { flex: none; padding-inline: 1rem; }
    #sessionNotice { max-width: 700px; margin: 1rem auto; text-align: center; color: #0a2540; }
    .container { box-sizing: border-box; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <section id="landing" class="container landing" aria-labelledby="landingTitle">
    <h1 id="landingTitle">Encoder &amp; Decoder</h1>
    <p>A simple, encoding and decoding system</p>
    <button id="enterButton" type="button">Enter</button>
    <p><small>This privacy lock clears data entry after 10 minutes of inactivity.<br>It is not authentication or secure encryption.</small></p>
  </section>
  <p id="sessionNotice" role="status" aria-live="polite" aria-atomic="true"></p>
  <main id="application" hidden inert>
    <header class="app-header">
      <h1 id="appTitle" tabindex="-1">Encoder &amp; Decoder</h1>
      <button id="logoutButton" type="button">Logout</button>
    </header>

  <div class="container">

    <section aria-label="Message Encoder">
      <h2>Encode - Input</h2>
      <label for="messageInput">Enter input text</label>
      <textarea autocomplete="off" id="messageInput" placeholder="Enter classified info here..." rows="4" oninput="autoResizeTextarea(this)"></textarea>

        <div class="button-row">
    
          <button class="paste-button" onclick="pasteClipboardText('messageInput')">Paste Copied</button>
       
        
      </div>
      <div class="button-row">
        <button onclick="encodeAndShow()">Encode</button>
        
        <button onclick="clearEncodeFields()">Clear</button>
        
      </div>

      <label for="encodedOutput" style="margin-top:1.5rem;">Encoded Output:</label>
      <textarea autocomplete="off" id="encodedOutput" readonly rows="5" oninput="autoResizeTextarea(this)"></textarea>

      <div class="button-row">
        <button onclick="copyText('encodedOutput')">Copy Encoded</button>
      </div>
    </section>

    <hr />

    <section aria-label="Message Decoder">
      <h2>Decode - Output</h2>
      <label for="secretInput">Enter text to decode</label>
      <textarea autocomplete="off" id="secretInput" placeholder="Paste intercepted code..." rows="4" oninput="autoResizeTextarea(this)"></textarea>

         <div class="button-row">
            <button class="paste-button" onclick="pasteClipboardText('secretInput')">Paste Copied</button>
      </div>
      <div class="button-row">
        <button onclick="decodeAndShow()">Decode</button>
        <button onclick="clearDecodeFields()">Clear</button>
      
      </div>

      <label for="decodedOutput" style="margin-top:1.5rem;">Decoded Output:</label>
      <textarea autocomplete="off" id="decodedOutput" readonly rows="5" oninput="autoResizeTextarea(this)"></textarea>

      <div class="button-row">
        <button onclick="copyText('decodedOutput')">Copy Decoded</button>
      </div>
    </section>

  </div>

  </main>
  <div id="copyTooltip" role="status" aria-live="polite">Copied!</div>

  <script>
    const secretMap = {
      'A': '*71!', 'B': '3@#$', 'C': '99!!', 'D': '2^&*', 'E': 'x!8&', 'F': '!$3!', 'G': '7>~4', 'H': '*!!',
      'I': '^^01', 'J': '&*#%', 'K': '$4@^', 'L': '1!2*', 'M': '7&@!', 'N': '!8^0', 'O': '8><*', 'P': '##!@',
      'Q': '6*!)', 'R': '44@@', 'S': '**$#', 'T': '9^!$', 'U': '!>!<', 'V': '!?##', 'W': '3><@', 'X': '@@##',
      'Y': '^!~*', 'Z': '0&*!',
      'a': '!3$%', 'b': '4&*!', 'c': '#7@!', 'd': '%%^*', 'e': '<.!', 'f': '&@!$', 'g': '@!3#', 'h': '~##!',
      'i': '0!0^', 'j': '^&*#', 'k': '!)4$', 'l': '9!0A', 'm': '$$!@', 'n': '8&!$', 'o': '88Ba*', 'p': '^^#@',
      'q': '%$^!', 'r': '?!>!', 's': '@#!!', 't': '#!!$', 'u': '*@#$', 'v': '!&^^', 'w': '(!)@', 'x': '^#^@',
      'y': '$!^&', 'z': '&$#^',
      '0': 'Z1!#', '1': '#@A$', '2': 'C!$%', '3': '9Z*$', '4': '!L@#', '5': 'Q*!!', '6': 'X#4$', '7': 'R$9!',
      '8': '$M@3', '9': 'P!0$', '.': '!@#$', ',': '&@^%', '?': '???!!', '!': '@!*!', '\'': '%*!@', '"': '@@!$',
      ':': '*!!@', ';': ';;!@', '-': '--%%', '(': '((@@', ')': '))@@', '@': '@@@@', '#': '###$', '$': '$$$!',
      '%': '%%%!', '^': '^^!!', '&': '&&&*', '*': '**!@', '+': '++@#', '=': '==!!', '/': '//@@', '\\': '\\\\@',
      '<': '<<!!', '>': '>>!!', '[': '[[##', ']': ']]##', '{': '{{!!', '}': '}}!!', '`': '`!!@', '~': '~~!!',
      '|': '|!|!', '_': '_!!_'
    };

    const decodeMap = {};
    for (const [k, v] of Object.entries(secretMap)) {
      decodeMap[v] = k;
    }

    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = (el.scrollHeight) + 'px';
    }

    function encodeAndShow() {
      if (!validateSession()) return;
      const input = document.getElementById('messageInput').value;
      const encoded = encodeMessage(input);
      const output = document.getElementById('encodedOutput');
      output.value = encoded;
      autoResizeTextarea(output);
    }

    function decodeAndShow() {
      if (!validateSession()) return;
      const input = document.getElementById('secretInput').value;
      const decoded = decodeMessage(input);
      const output = document.getElementById('decodedOutput');
      output.value = decoded;
      autoResizeTextarea(output);
    }

    function encodeMessage(text) {
      let encoded = '';
      for (let ch of text) {
        encoded += secretMap[ch] ?? ch;
      }
      return encoded;
    }

    function decodeMessage(text) {
      let decoded = '';
      let i = 0;
      while (i < text.length) {
        let matched = false;
        for (let len = 5; len > 0; len--) {
          let chunk = text.substr(i, len);
          if (decodeMap[chunk]) {
            decoded += decodeMap[chunk];
            i += len;
            matched = true;
            break;
          }
        }
        if (!matched) {
          decoded += text[i];
          i++;
        }
      }
      return decoded;
    }

    async function copyText(id) {
      if (!validateSession()) return;
      const generation = sessionGeneration;
      const el = document.getElementById(id);
      if (!el.value) return;
      el.select();
      el.setSelectionRange(0, el.value.length);
      try {
        await navigator.clipboard.writeText(el.value);
        if (generation === sessionGeneration && validateSession()) showCopyTooltip();
      } catch {
        if (generation === sessionGeneration && validateSession()) {
          document.getElementById('sessionNotice').textContent = 'Copy unavailable. Select the output and copy it manually.';
        }
      }
    }

    async function pasteClipboardText(id) {
      if (!validateSession()) return;
      const generation = sessionGeneration;
      try {
        const text = await navigator.clipboard.readText();
        if (generation !== sessionGeneration || !validateSession()) return;
        const el = document.getElementById(id);
        el.value += text;
        autoResizeTextarea(el);
      } catch {
        if (generation === sessionGeneration && validateSession()) {
          document.getElementById('sessionNotice').textContent = 'Paste unavailable. Paste into the input manually.';
        }
      }
    }

    function showCopyTooltip() {
      const tooltip = document.getElementById('copyTooltip');
      tooltip.classList.add('show');
      setTimeout(() => tooltip.classList.remove('show'), 1500);
    }

    function clearEncodeFields() {
      document.getElementById('messageInput').value = '';
      document.getElementById('encodedOutput').value = '';
      autoResizeTextarea(document.getElementById('messageInput'));
      autoResizeTextarea(document.getElementById('encodedOutput'));
    }

    function clearDecodeFields() {
      document.getElementById('secretInput').value = '';
      document.getElementById('decodedOutput').value = '';
      autoResizeTextarea(document.getElementById('secretInput'));
      autoResizeTextarea(document.getElementById('decodedOutput'));
    }

    const SESSION_KEY = 'encoderDecoderLastActivity';
    const INACTIVITY_MS = 600000;
    let lastActivity = 0;
    let sessionGeneration = 0;
    let expirationTimer;
    const application = document.getElementById('application');
    const landing = document.getElementById('landing');
    const notice = document.getElementById('sessionNotice');

    function storeActivity() {
      try { sessionStorage.setItem(SESSION_KEY, String(lastActivity)); } catch { /* In-memory session still works. */ }
    }

    function clearMessages() {
      document.querySelectorAll('textarea').forEach(el => {
        el.value = '';
        el.style.height = 'auto';
      });
      document.getElementById('copyTooltip').classList.remove('show');
    }

    function endSession(expired = false, moveFocus = true) {
      clearMessages();
      sessionGeneration++;
      lastActivity = 0;
      clearTimeout(expirationTimer);
      try { sessionStorage.removeItem(SESSION_KEY); } catch { /* Storage may be unavailable. */ }
      application.hidden = true;
      application.inert = true;
      landing.hidden = false;
      notice.textContent = expired
        ? 'Session expired due to inactivity. All messages have been cleared.'
        : '';
      if (moveFocus) document.getElementById('enterButton').focus();
    }

    function scheduleExpiration() {
      clearTimeout(expirationTimer);
      expirationTimer = setTimeout(validateSession, Math.max(0, INACTIVITY_MS - (Date.now() - lastActivity)));
    }

    function validateSession() {
      if (!lastActivity) return false;
      const elapsed = Date.now() - lastActivity;
      if (elapsed < 0 || elapsed >= INACTIVITY_MS) {
        endSession(true);
        return false;
      }
      scheduleExpiration();
      return true;
    }

    function showApplication(moveFocus = false) {
      landing.hidden = true;
      application.hidden = false;
      application.inert = false;
      document.querySelectorAll('textarea').forEach(autoResizeTextarea);
      if (moveFocus) document.getElementById('appTitle').focus();
    }

    document.getElementById('enterButton').addEventListener('click', () => {
      clearMessages();
      sessionGeneration++;
      lastActivity = Date.now();
      storeActivity();
      notice.textContent = '';
      showApplication(true);
      scheduleExpiration();
    });
    document.getElementById('logoutButton').addEventListener('click', () => endSession());

    // Capture checks expiry before an interaction can renew or use a suspended session.
    for (const type of ['keydown', 'pointerdown', 'touchstart', 'click', 'input']) {
      document.addEventListener(type, event => {
        if (!event.isTrusted || !lastActivity) return;
        if (!validateSession()) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return;
        }
        lastActivity = Date.now();
        storeActivity();
        scheduleExpiration();
      }, true);
    }

    // Conceal before a page can enter BFCache; never retain message fields in history.
    window.addEventListener('pagehide', () => {
      clearMessages();
      sessionGeneration++;
      application.hidden = true;
      application.inert = true;
    });
    function resumeSession() {
      if (validateSession()) showApplication();
      else clearMessages();
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        application.hidden = true;
        application.inert = true;
      } else resumeSession();
    });
    window.addEventListener('focus', resumeSession);
    window.addEventListener('pageshow', () => {
      clearMessages();
      resumeSession();
    });

    clearMessages();
    try {
      const stored = Number(sessionStorage.getItem(SESSION_KEY));
      if (Number.isFinite(stored) && stored > 0) lastActivity = stored;
    } catch { /* Fall back to a fresh, in-memory session. */ }
    resumeSession();
  </script>

</body>
</html>
